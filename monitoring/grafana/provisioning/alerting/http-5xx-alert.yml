apiVersion: 1

groups:
  - orgId: 1
    name: backend-http-errors
    folder: Projet Backend - Observabilité
    interval: 1m
    rules:
      - uid: http5xxrate
        title: HTTP 5xx error rate above 5 percent
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: >-
                (
                  (sum(rate(nodejs_http_requests_total{status=~"5.."}[5m])) or vector(0))
                  + (sum(rate(http_server_requests_seconds_count{status=~"5..",uri!~"/actuator.*"}[5m])) or vector(0))
                  + (sum(rate(laravel_http_requests_total{status=~"5.."}[5m])) or vector(0))
                )
                /
                clamp_min(
                  (sum(rate(nodejs_http_requests_total[5m])) or vector(0))
                  + (sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) or vector(0))
                  + (sum(rate(laravel_http_requests_total[5m])) or vector(0)),
                  0.000000001
                )
              instant: true
              range: false
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                    params: []
                  query:
                    params:
                      - B
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
          service: backend-api
        annotations:
          summary: Backend HTTP 5xx rate exceeds 5% over five minutes
          description: The combined HTTP 5xx request rate across Express, Spring Boot, and Laravel has exceeded 5% over the last five minutes.
