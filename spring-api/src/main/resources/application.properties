spring.application.name=lab3-jpa
logging.structured.format.console=logstash

# Actuator and Prometheus metrics
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.tags.application=spring-backend-api
management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.datasource.url=jdbc:mysql://localhost:3306/lab3_db
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# JWT Configuration
jwt.secret=MySuperSecretKeyForJwtSigningDontShare123456789
jwt.expiration=600000
# API Key Configuration
app.api-key=${API_KEY:secret-api-key-123}
