# ==============================================================================
# Pipeline CD / Build Docker & Publication GHCR
# Se déclenche après la réussite des workflows CI pour construire et publier les images
# ==============================================================================
name: Docker Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Spring Boot CI", "Express.js CI", "Laravel CI"]
    types: [completed]

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    # Exécution conditionnelle : en manuel (workflow_dispatch) OU en cas de succès du workflow CI déclencheur
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    # Moindre privilège : droit d'écriture restreint à GHCR (packages: write)
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration du builder Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Authentification sécurisée auprès de GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Conversion du nom de repository en minuscules (requis par les spécifications OCI/GHCR)
      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # 5. Construction et publication de l'image Spring Boot (le Dockerfile compile le JAR)
      - name: Build & Push Spring API Image
        uses: docker/build-push-action@v5
        with:
          context: ./spring-api
          push: true
          provenance: false
          tags: ghcr.io/${{ steps.repo_owner.outputs.owner }}/spring-api:latest

      # 7. Construction et publication de l'image Express.js
      - name: Build & Push Express API Image
        uses: docker/build-push-action@v5
        with:
          context: ./express-api
          push: true
          provenance: false
          tags: ghcr.io/${{ steps.repo_owner.outputs.owner }}/express-api:latest

      # 8. Construction et publication de l'image Laravel
      - name: Build & Push Laravel API Image
        uses: docker/build-push-action@v5
        with:
          context: ./laravel-api
          push: true
          provenance: false
          tags: ghcr.io/${{ steps.repo_owner.outputs.owner }}/laravel-api:latest
