# ==============================================================================
# Pipeline CI : Express.js (Node.js)
# Installe les dépendances npm, exécute l'analyse ESLint et lance les tests
# ==============================================================================
name: Express.js CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Lint & Test (Node.js 20)
    runs-on: ubuntu-latest

    # Application du principe du moindre privilège (DevSecOps)
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: product_api
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: product_api
      API_KEY: ci-test-api-key
      JWT_SECRET: ci-test-jwt-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret

    steps:
      # 1. Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configuration de l'environnement Node.js 20 avec cache npm
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: express-api/package-lock.json

      # 3. Installation propre et déterministe des dépendances
      - name: Install Dependencies
        run: npm ci --prefix express-api

      - name: Initialize MySQL schema
        run: node express-api/src/test-db-init.js

      # 4. Analyse statique du code avec ESLint
      # continue-on-error: false force l'arrêt immédiat en cas d'erreurs de lint
      - name: Lint Code
        run: npm run lint --prefix express-api
        continue-on-error: false

      # 5. Exécution de la suite de tests unitaires / intégration
      - name: Run Tests
        run: npm test --prefix express-api

      - name: Upload Jest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: express-jest-report
          path: express-api/jest-results.json
          if-no-files-found: warn
