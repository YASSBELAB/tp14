global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'spring-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['spring-backend:8080']

  - job_name: 'nodejs-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['nodejs-backend:3000']

  - job_name: 'laravel-app'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['laravel-backend:80']
